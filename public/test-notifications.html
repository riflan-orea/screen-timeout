<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .warning { background: #fff3cd; color: #856404; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>Notification Test Page</h1>
    
    <div class="test-section">
        <h2>Device Information</h2>
        <div id="device-info"></div>
    </div>

    <div class="test-section">
        <h2>Permission Test</h2>
        <button onclick="checkPermission()">Check Permission</button>
        <button onclick="requestPermission()">Request Permission</button>
        <div id="permission-status"></div>
    </div>

    <div class="test-section">
        <h2>Service Worker Test</h2>
        <button onclick="checkServiceWorker()">Check Service Worker</button>
        <button onclick="registerServiceWorker()">Register Service Worker</button>
        <div id="sw-status"></div>
    </div>

    <div class="test-section">
        <h2>Notification Test</h2>
        <button onclick="testDirectNotification()">Test Direct Notification</button>
        <button onclick="testServiceWorkerNotification()">Test Service Worker Notification</button>
        <div id="notification-status"></div>
    </div>

    <script>
        function log(message, type = 'info') {
            console.log(`[${type.toUpperCase()}] ${message}`);
            const statusDiv = document.getElementById(`${type}-status`);
            if (statusDiv) {
                statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
            }
        }

        function updateDeviceInfo() {
            const info = {
                userAgent: navigator.userAgent,
                isAndroid: /Android/i.test(navigator.userAgent),
                isChrome: /Chrome/i.test(navigator.userAgent),
                isFirefox: /Firefox/i.test(navigator.userAgent),
                isSafari: /Safari/i.test(navigator.userAgent),
                notificationsSupported: 'Notification' in window,
                serviceWorkerSupported: 'serviceWorker' in navigator,
                online: navigator.onLine
            };
            
            document.getElementById('device-info').innerHTML = `
                <div class="status info">
                    <strong>User Agent:</strong> ${info.userAgent}<br>
                    <strong>Android:</strong> ${info.isAndroid ? 'Yes' : 'No'}<br>
                    <strong>Chrome:</strong> ${info.isChrome ? 'Yes' : 'No'}<br>
                    <strong>Firefox:</strong> ${info.isFirefox ? 'Yes' : 'No'}<br>
                    <strong>Safari:</strong> ${info.isSafari ? 'Yes' : 'No'}<br>
                    <strong>Notifications Supported:</strong> ${info.notificationsSupported ? 'Yes' : 'No'}<br>
                    <strong>Service Worker Supported:</strong> ${info.serviceWorkerSupported ? 'Yes' : 'No'}<br>
                    <strong>Online:</strong> ${info.online ? 'Yes' : 'No'}
                </div>
            `;
        }

        function checkPermission() {
            if (!('Notification' in window)) {
                log('Notifications not supported', 'error');
                return;
            }
            
            const permission = Notification.permission;
            log(`Current permission: ${permission}`, permission === 'granted' ? 'success' : 'warning');
        }

        async function requestPermission() {
            if (!('Notification' in window)) {
                log('Notifications not supported', 'error');
                return;
            }
            
            try {
                const permission = await Notification.requestPermission();
                log(`Permission result: ${permission}`, permission === 'granted' ? 'success' : 'warning');
            } catch (error) {
                log(`Error requesting permission: ${error.message}`, 'error');
            }
        }

        function checkServiceWorker() {
            if (!('serviceWorker' in navigator)) {
                log('Service Worker not supported', 'error');
                return;
            }
            
            navigator.serviceWorker.getRegistration().then(registration => {
                if (registration) {
                    log(`Service Worker registered: ${registration.active ? 'Active' : 'Inactive'}`, 'success');
                } else {
                    log('No Service Worker registered', 'warning');
                }
            }).catch(error => {
                log(`Error checking Service Worker: ${error.message}`, 'error');
            });
        }

        async function registerServiceWorker() {
            if (!('serviceWorker' in navigator)) {
                log('Service Worker not supported', 'error');
                return;
            }
            
            try {
                const registration = await navigator.serviceWorker.register('/sw.js');
                log('Service Worker registered successfully', 'success');
                
                // Wait for it to be ready
                await navigator.serviceWorker.ready;
                log('Service Worker is ready', 'success');
            } catch (error) {
                log(`Error registering Service Worker: ${error.message}`, 'error');
            }
        }

        function testDirectNotification() {
            if (!('Notification' in window)) {
                log('Notifications not supported', 'error');
                return;
            }
            
            if (Notification.permission !== 'granted') {
                log('Notification permission not granted', 'error');
                return;
            }
            
            try {
                const notification = new Notification('Test Notification', {
                    body: 'This is a test notification from the direct API',
                    icon: '/icon-192.png',
                    tag: 'test-notification',
                    requireInteraction: true
                });
                
                notification.onclick = () => {
                    log('Direct notification clicked', 'success');
                    notification.close();
                };
                
                notification.onshow = () => {
                    log('Direct notification shown', 'success');
                };
                
                notification.onerror = (error) => {
                    log(`Direct notification error: ${error}`, 'error');
                };
                
                setTimeout(() => notification.close(), 10000);
            } catch (error) {
                log(`Error showing direct notification: ${error.message}`, 'error');
            }
        }

        function testServiceWorkerNotification() {
            if (!('serviceWorker' in navigator)) {
                log('Service Worker not supported', 'error');
                return;
            }
            
            navigator.serviceWorker.ready.then(registration => {
                if (registration.active) {
                    registration.active.postMessage({
                        type: 'SHOW_NOTIFICATION',
                        title: 'Test SW Notification',
                        body: 'This is a test notification from Service Worker'
                    });
                    log('Service Worker notification message sent', 'success');
                } else {
                    log('No active Service Worker', 'error');
                }
            }).catch(error => {
                log(`Error with Service Worker notification: ${error.message}`, 'error');
            });
        }

        // Initialize
        updateDeviceInfo();
        
        // Listen for service worker messages
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('message', event => {
                log(`Service Worker message: ${JSON.stringify(event.data)}`, 'info');
            });
        }
    </script>
</body>
</html>
